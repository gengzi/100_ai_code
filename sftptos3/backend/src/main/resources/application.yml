server:
  port: 8080

spring:
  application:
    name: sftp-to-s3
  datasource:
    url: jdbc:postgresql://localhost:5432/sftps3
    username: sftps3
    password: sftps3
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

sftp:
  host: 0.0.0.0
  port: 2022
  host-key-file: ./hostkey.ser
  # 后续将配置用户/权限/限流及 S3 目标绑定
