server:
  port: 8080

spring:
  application:
    name: sftp-to-s3
  datasource:
    url: jdbc:postgresql://localhost:5432/sftps3
    username: sftps3
    password: sftps3
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

sftp:
  host: 0.0.0.0
  port: 2022
  host-key-file: ./hostkey.ser
  temp-dir: ./data/tmp
  temp-ttl: 4h
  temp-quota-bytes: 10737418240 # 10GB
  # TODO: later link to auth/limits/storage binding

storage:
  targets:
    - name: default
      region: us-east-1
      endpoint: http://localhost:9000
      path-style: true
      access-key: minioadmin
      secret-key: minioadmin
      bucket: test-bucket
      base-prefix: ""
