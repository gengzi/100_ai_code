spring:
  application:
    name: nostalgia-ai

  # H2 Database配置
  datasource:
    url: jdbc:h2:mem:nostalgia_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2控制台
  h2:
    console:
      enabled: true
      path: /h2-console

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # AI配置
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      chat:
        options:
          model: gpt-4
          temperature: 0.7

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api

# 文件存储配置
file:
  upload-dir: ${user.home}/nostalgia-uploads

# 日志配置
logging:
  level:
    com.sinian.nostalgia: DEBUG
    org.springframework.ai: DEBUG
