  # 下载配置
  download:
    # 下载路径
    path: "downloads"
    # 文件命名模式
    naming: "{create}_{desc}_{nickname}"  # create:创建时间 desc:描述 nickname:作者
    # 分片下载线程数
    chunk: 16
    # 最大重试次数
    max-retries: 3
    # 下载超时时间（秒）
    timeout: 60

  # 参数配置
  params:
    # 设备信息
    device_id: ""
    # 安装包信息
    install_id: ""
    # 更新的时间戳
    update_version_code: ""
    # app版本
    app_name: "douyin_android"
    # 设备平台
    device_platform: "android"
    # 设备类型
    device_type: "SM-G9810"
    # os版本
    os_version: "11"
    # openudid
    openudid: ""
    # manifest_version_code
    manifest_version_code: ""
    # resolution
    resolution: "1080*2400"
    # dpi
    dpi: "420"
    # 渠道
    channel: "googleplay"
    # app版本
    app_version: "260102"
    # 版本号
    version_code: "260102"
    # 语言
    language: "zh"
    # ab调试版本
    app_type: "normal"
    # aid
    aid: "1128"
    # sdk版本
    sdk_version: "2.3.8.4"
    # 版本名称
    version_name: "26.1.2"
    # manifest版本号
    manifest_version_name: "26.1.2"

# TikTok配置
tiktok:
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    Referer: "https://www.tiktok.com/"

  download:
    path: "downloads"
    naming: "{create}_{desc}_{nickname}"
    chunk: 16
    max-retries: 3
    timeout: 60

# 通用配置
common:
  # 是否使用代理
  proxy: null  # 例如: "http://127.0.0.1:7890"

  # 日志级别
  log-level: "INFO"

  # 数据库配置
  database:
    path: "~/.f2/data/f2.db"
